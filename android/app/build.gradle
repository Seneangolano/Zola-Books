apply plugin: 'com.android.application'

android {
    namespace "com.zolabooks.angola"
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.zolabooks.angola"
        minSdkVersion 22
        targetSdkVersion 35
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Android 15 SoC 16 KB Page Alignment ABI Filters
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        manifestPlaceholders = [
            appName: "Zola Books",
            appScheme: "zolabooks"
        ]
    }

    signingConfigs {
        release {
            // Production Release Keystore Configuration
            storeFile file("zolabooks-release.jks")
            storePassword "ZolaBooks2026Angola"
            keyAlias "zolabooks"
            keyPassword "ZolaBooks2026Angola"
            v1SigningEnabled true
            v2SigningEnabled true
            v3SigningEnabled true
            v4SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Ensure standalone universal APK generation (no split APK slices)
    splits {
        abi {
            enable false
        }
        density {
            enable false
        }
    }

    bundle {
        density {
            enableSplit false
        }
        abi {
            enableSplit false
        }
        language {
            enableSplit false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES', 
                'META-INF/LICENSE', 
                'META-INF/NOTICE',
                'META-INF/*.version',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
